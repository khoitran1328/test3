[Script]
# TOÀN BỘ SCRIPT ĐÃ ĐƯỢC NHÚNG BASE64 - CHẠY LOCAL 100%

# LOCKET UNLOCK
locket_rc = type=http-response,pattern=^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),requires-body=true,max-size=-1,script-path=data:text/javascript;base64,

locket_fb = type=http-response,pattern=^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+,requires-body=true,max-size=-1,script-path=data:text/javascript;base64,

# YOUTUBE UNLOCK
youtube_response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config))(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1,script-path=data:text/javascript;base64,

# SPOTIFY UNLOCK
spotify_json = type=http-request,pattern=^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(?::443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/,requires-body=0,script-path=data:text/javascript;base64,

spotify_proto = type=http-response,pattern=^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(?::443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize),requires-body=1,binary-body-mode=1,max-size=0,script-path=data:text/javascript;base64,

[Host]
firebaseremoteconfigrealtime.googleapis.com = 0.0.0.0

[MITM]
hostname = %APPEND% -firebasestorage.googleapis.com, -*.firebasestorage.app, -storage.googleapis.com, -*.appspot.com, -firebaseinstallations.googleapis.com, -identitytoolkit.googleapis.com, -securetoken.googleapis.com, -firestore.googleapis.com, -*.firebaseio.com, -*.firebasedatabase.app, -www.googleapis.com, -oauth2.googleapis.com, -people.googleapis.com, -api.spotify.com, -open.spotify.com, -accounts.spotify.com, -*.scdn.co, *.googlevideo.com, youtubei.googleapis.com, api.revenuecat.com, firebaseremoteconfig.googleapis.com, spclient.wg.spotify.com, *spclient.spotify.com, api.locketcamera.com, us-central1-locket-4252a.cloudfunctions.net, locket-pro-backend.onrender.com, i.ibb.co